<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anahtarını al · WizzyHax</title>
<meta name="theme-color" content="#070910">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap inner">
    <a class="brand" href="/" aria-label="WizzyHax">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#b6ff3c"/><text x="16" y="23" font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0a1200">W</text></svg>
      <span>Wizzy<b>Hax</b></span>
    </a>
    <nav class="site-nav">
      <a href="/#products" data-i18n="nav.products">Ürünler</a>
      <a href="/sss.html" data-i18n="nav.faq">SSS</a>
      <a href="/iletisim.html" data-i18n="nav.contact">İletişim</a>
    </nav>
    <button class="lang" type="button" data-lang-toggle data-lang-label>EN</button>
  </div>
</header>

<main class="wrap">
  <section class="page-head">
    <h1 data-i18n="ty.title">Anahtarını al</h1>
    <p class="lead" data-i18n="ty.lead">Gumroad makbuzundaki sipariş numarası ve e-posta adresi ile anahtarını görüntüle.</p>
  </section>

  <section style="padding-bottom:60px">
    <form class="form" id="lookupForm" autocomplete="on">
      <label>
        <span data-i18n="ty.email">E-posta adresi</span>
        <input id="lookupEmail" name="email" type="email" inputmode="email" required data-i18n-ph="ty.email" placeholder="E-posta adresi">
      </label>
      <label>
        <span data-i18n="ty.order">Sipariş numarası</span>
        <input id="lookupOrder" name="order" type="text" required placeholder="WZ-XXXXXX" autocapitalize="characters" style="font-family:ui-monospace,monospace;letter-spacing:.08em">
      </label>
      <button class="btn btn-primary" type="submit" data-i18n="ty.submit">Anahtarımı göster</button>
      <p class="small muted" style="margin:0" data-i18n="ty.hint">Sipariş numarası Gumroad'dan gelen e-postada yer alır.</p>
    </form>

    <div id="lookupMsg" class="msg" role="status" style="margin-top:16px"></div>
    <div id="lookupResult" style="margin-top:16px;display:grid;gap:10px"></div>
  </section>
</main>

<footer class="site-foot">
  <div class="wrap inner">
    <div>© <span id="year">2026</span> WizzyHax</div>
    <nav>
      <a href="/sartlar.html" data-i18n="foot.terms">Kullanım şartları</a>
      <a href="/iade.html" data-i18n="foot.refund">İade politikası</a>
      <a href="/iletisim.html" data-i18n="foot.contact">İletişim</a>
    </nav>
  </div>
</footer>

<script src="/assets/app.js" defer></script>
</body>
</html>
